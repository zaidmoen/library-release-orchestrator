[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "library-release-orchestrator"
version = "0.1.0"
description = "Dependency-aware, out-of-order release planning for shared libraries, with a Claude Code Skill front end."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Library Release Orchestrator contributors" }]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
release-orchestrator = "release_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["integration: tests that build real Git repositories"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "S603",  # subprocess without shell=True is the safe form we use deliberately
  "S607",  # 'git' resolved from PATH by design
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "S108"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["release_orchestrator"]
